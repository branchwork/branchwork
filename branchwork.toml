# Branchwork repo-level config. See docs/reference/branchwork-toml.md.
#
# This file ships as the **default allowlist for branchwork-on-branchwork**:
# when an agent is working on Branchwork itself, the dirty-tree check
# loads this file and uses [auto_mode.dirty_tree].ignore below to filter
# out known operational-noise paths before deciding whether to pause the
# plan with `agent_left_uncommitted_work`.
#
# Why ship a default file even after Phase 1 (untrack server.log /
# runner.log / .bob/ / web-dev.log) landed:
# - Existing checkouts that did NOT pull Phase 1 still carry tracked
#   logs; without this allowlist any `cargo run` would dirty them and
#   pause the active plan.
# - Operational files written by the dev server / runner / scratch
#   tooling (`*.log`, `.bob/**`) are noise the agent can't reason
#   about — git status surfacing them isn't a signal that the agent
#   forgot to commit real code. The allowlist makes that explicit.
# - Real code-path drift (server-rs/, web/src/, ...) is NOT ignored:
#   any tracked file outside the patterns below still trips the pause.
#
# Keep this list minimum-viable. Extend on a per-file-family basis with
# a short comment naming the source of the noise so future contributors
# know which entry came from which production code path.

[auto_mode.dirty_tree]
ignore = [
    # Local-dev server/runner stdout redirect targets (Makefile dev-server
    # / dev-web targets, server-rs/cargo run). Phase 1 untracked these
    # via .gitignore but agents on stale checkouts may still see them.
    "*.log",
    # Operator scratch dir (per-checkout notes, transient error logs).
    # Only .bob/README.md is tracked — the rest is per-host state.
    ".bob/**",
]

# Pre-merge gate. Each entry runs (via `sh -c`) in a detached-HEAD
# worktree off the task branch tip before auto-mode merges into master.
# Any non-zero exit pauses the plan with reason `pre_merge_check_failed`
# and surfaces the failing check name + output in the dashboard (see
# pre-merge-gate plan T1.3).
#
# Ordering matters: checks run sequentially in declared order and the
# gate short-circuits on the first failure, so cheap checks come first
# and the install step that downstream web checks depend on runs before
# them.
#
# Why each check is here:
# - cargo-fmt: subsecond, catches formatting drift before it ever hits CI.
# - web-install: populates node_modules in the fresh worktree so the
#   web-* checks below have something to run against. pnpm's CAS store
#   makes this cheap on a warm host (~5-15s).
# - web-lint / web-format / web-build / web-test / web-bundle: mirror
#   the steps in .github/workflows/tests.yml::web. `web-build`
#   (`tsc -b && vite build`) is the one that would have caught the
#   2026-05-21 master failure where `TaskCard.test.tsx` referenced a
#   `mergeCadence` field that no longer exists on `PlanConfig` —
#   tsc -b typechecks .test.tsx files alongside .tsx ones.
# - web-test is intentionally listed even though tests.yml does not
#   currently run vitest; the gate is the right place to catch a
#   broken test before merging while we close that CI gap separately.
#
# Heavier Rust checks (clippy, cargo test) intentionally stay in CI
# (`task-tests.yml`) for now — they cold-rebuild in a fresh worktree
# and would blow the 600s/check ceiling. Revisit once the gate runner
# learns to share a CARGO_TARGET_DIR across runs.

[[auto_mode.pre_merge_checks]]
name = "cargo-fmt"
cmd  = "cargo fmt --check"
cwd  = "server-rs"
timeout_secs = 60

[[auto_mode.pre_merge_checks]]
name = "web-install"
cmd  = "pnpm install --frozen-lockfile"
timeout_secs = 120

[[auto_mode.pre_merge_checks]]
name = "web-lint"
cmd  = "pnpm --filter @branchwork/web lint"
timeout_secs = 60

[[auto_mode.pre_merge_checks]]
name = "web-format"
cmd  = "pnpm --filter @branchwork/web format:check"
timeout_secs = 60

[[auto_mode.pre_merge_checks]]
name = "web-build"
cmd  = "pnpm --filter @branchwork/web build"
timeout_secs = 180

[[auto_mode.pre_merge_checks]]
name = "web-test"
cmd  = "pnpm --filter @branchwork/web test"
timeout_secs = 180

[[auto_mode.pre_merge_checks]]
name = "web-bundle"
cmd  = "pnpm --filter @branchwork/web bundle:check"
timeout_secs = 60
