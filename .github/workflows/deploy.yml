name: Deploy

# Auto-deploys to Hetzner (branchwork.dev) once the Docker workflow finishes
# publishing the image for a master commit. Deploys by short SHA tag rather
# than :edge — :edge can lag behind the most recent master commit (if a tag
# build interleaved, or a workflow_run on master never completed), so naively
# pulling :edge has caused a version *regression* on prod. The SHA tag
# (produced by docker.yml's metadata-action `type=sha,prefix=,format=short`)
# is immutable and points at exactly the commit we want.
#
# The workflow writes BRANCHWORK_VERSION=<sha7> into
# /opt/branchwork/src/deploy/.env so subsequent ad-hoc `docker compose up -d`
# on the host still picks the right image. Prior .env is rotated to
# .env.bak.<unix-ts> for trivial rollback.
#
# Manual dispatch deploys master's current HEAD SHA — requires that Docker
# has already built that commit, else `compose pull` fails loudly.

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HETZNER_USER: cpo
      HETZNER_HOST: 95.216.191.129
      PROD_DIR: /opt/branchwork/src

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          # workflow_run carries the SHA the upstream Docker run was triggered
          # on. Manual dispatch uses the current ref's SHA (master HEAD at
          # dispatch time).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            full="${{ github.event.workflow_run.head_sha }}"
          else
            full="${{ github.sha }}"
          fi
          short="${full:0:7}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/branchwork/branchwork:$short (commit $full)"

      - name: Install SSH credentials
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture pre-deploy state
        id: pre
        run: |
          set -euo pipefail
          before=$(curl -sf --max-time 10 https://branchwork.dev/health || echo '{}')
          echo "Pre-deploy /health: $before"
          ws=$(echo "$before" | jq -r '.wsConnections // 0')
          uptime=$(echo "$before" | jq -r '.uptimeSeconds // 0')
          ver=$(echo "$before" | jq -r '.version // "unknown"')
          echo "ws=$ws" >> "$GITHUB_OUTPUT"
          echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Sync compose files to host
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              deploy/docker-compose.yml \
              deploy/docker-compose.prod.yml \
              ${HETZNER_USER}@${HETZNER_HOST}:${PROD_DIR}/deploy/

      - name: Pin version in .env and roll the container
        env:
          SHA: ${{ steps.target.outputs.short }}
          FULL_SHA: ${{ steps.target.outputs.full }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              ${HETZNER_USER}@${HETZNER_HOST} \
              "SHA=${SHA} FULL_SHA=${FULL_SHA} PROD_DIR=${PROD_DIR} bash -se" <<'REMOTE'
          set -euo pipefail
          cd "${PROD_DIR}/deploy"
          # Rotate the existing .env so a manual rollback is just `mv`.
          if [ -f .env ]; then
            cp .env ".env.bak.$(date +%s)"
          fi
          {
            echo "# Written by GitHub Actions deploy.yml — do not edit by hand"
            echo "# Commit: ${FULL_SHA}"
            echo "# At:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BRANCHWORK_VERSION=${SHA}"
          } > .env
          cd "${PROD_DIR}"
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.prod.yml pull
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.prod.yml up -d
          REMOTE

      - name: Verify post-deploy health
        id: post
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            resp=$(curl -sf --max-time 5 https://branchwork.dev/health || echo '')
            if [ -n "$resp" ]; then
              uptime=$(echo "$resp" | jq -r '.uptimeSeconds // -1')
              ver=$(echo "$resp" | jq -r '.version // "unknown"')
              ws=$(echo "$resp" | jq -r '.wsConnections // 0')
              echo "Post-deploy /health: $resp"
              echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
              echo "version=$ver" >> "$GITHUB_OUTPUT"
              echo "ws=$ws" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$i/60] /health not 200 yet…"
            sleep 5
          done
          echo "::error::/health did not return 200 within 5 minutes"
          exit 1

      - name: Verify running image matches target SHA
        env:
          SHA: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          running=$(ssh -i ~/.ssh/id_ed25519 \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              ${HETZNER_USER}@${HETZNER_HOST} \
              "cd ${PROD_DIR} && docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml ps --format '{{.Image}}' branchwork")
          echo "Running image: $running"
          if [[ "$running" != *":${SHA}" ]]; then
            echo "::error::Running image '$running' does not end in ':${SHA}'"
            exit 1
          fi

      - name: Verify WS connections recovered
        run: |
          set -euo pipefail
          pre_ws='${{ steps.pre.outputs.ws }}'
          pre_uptime='${{ steps.pre.outputs.uptime }}'
          post_uptime='${{ steps.post.outputs.uptime }}'
          if [ "$pre_ws" = "0" ] || [ -z "$pre_ws" ]; then
            echo "No WS connections pre-deploy; skipping reconnect check"
            exit 0
          fi
          if [ "$post_uptime" -ge "$pre_uptime" ]; then
            echo "No container recreate (pre=$pre_uptime, post=$post_uptime); skipping reconnect check"
            exit 0
          fi
          for i in $(seq 1 12); do
            after_ws=$(curl -sf --max-time 5 https://branchwork.dev/health | jq -r '.wsConnections // 0')
            if [ "$after_ws" -gt 0 ]; then
              echo "WS reconnected: $after_ws (was $pre_ws pre-deploy)"
              exit 0
            fi
            echo "[$i/12] waiting for WS reconnect (currently $after_ws)…"
            sleep 5
          done
          echo "::error::No WS clients reconnected within 60s (had $pre_ws before)"
          exit 1
