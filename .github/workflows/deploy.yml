name: Deploy

# Auto-deploys the `:edge` image to Hetzner (branchwork.dev) once the Docker
# workflow finishes publishing it. The Docker workflow is itself gated on a
# green CI run (see docker.yml's `workflow_run` trigger), so by the time we
# fire here, the image referenced by docker-compose.prod.yml is guaranteed
# to exist and CI was green for the same commit.
#
# Manual dispatch is also available for redeploying without a code change
# (e.g. after rolling back BRANCHWORK_VERSION in /opt/branchwork/src/deploy/.env).
#
# Layout on the host (see docs/ops/hetzner.md):
#   /opt/branchwork/src/deploy/{docker-compose.yml,docker-compose.prod.yml,.env}
#   /opt/branchwork/data/branchwork.db
# Note: /opt/branchwork/src is not a git checkout — we scp the compose files
# from the actions/checkout into place, leaving .env untouched.

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Serialise deploys so two concurrent rolls can't fight over compose state.
# cancel-in-progress=false: let an in-flight deploy finish before the next
# starts, rather than killing it partway through a container recreate.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Skip when the upstream Docker run failed. Manual dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH credentials
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture pre-deploy state
        id: pre
        run: |
          set -euo pipefail
          before=$(curl -sf --max-time 10 https://branchwork.dev/health || echo '{}')
          echo "Pre-deploy /health: $before"
          ws=$(echo "$before" | jq -r '.wsConnections // 0')
          uptime=$(echo "$before" | jq -r '.uptimeSeconds // 0')
          ver=$(echo "$before" | jq -r '.version // "unknown"')
          echo "ws=$ws" >> "$GITHUB_OUTPUT"
          echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Sync compose files to host
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              deploy/docker-compose.yml \
              deploy/docker-compose.prod.yml \
              cpo@95.216.191.129:/opt/branchwork/src/deploy/

      - name: Pull and recreate
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              cpo@95.216.191.129 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/branchwork/src
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.prod.yml pull
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.prod.yml up -d
          REMOTE

      - name: Verify post-deploy health
        id: post
        run: |
          set -euo pipefail
          # /health must come back 200 after the deploy. Poll up to 5 min for
          # slow image pulls or arch-specific surprises. Captures uptime so
          # the next step can tell whether a restart actually happened (a
          # no-op deploy — same image digest — leaves uptime monotonically
          # increasing and is still a valid outcome for manual_dispatch).
          for i in $(seq 1 60); do
            resp=$(curl -sf --max-time 5 https://branchwork.dev/health || echo '')
            if [ -n "$resp" ]; then
              uptime=$(echo "$resp" | jq -r '.uptimeSeconds // -1')
              ver=$(echo "$resp" | jq -r '.version // "unknown"')
              ws=$(echo "$resp" | jq -r '.wsConnections // 0')
              echo "Post-deploy /health: $resp"
              echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
              echo "version=$ver" >> "$GITHUB_OUTPUT"
              echo "ws=$ws" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$i/60] /health not 200 yet…"
            sleep 5
          done
          echo "::error::/health did not return 200 within 5 minutes"
          exit 1

      - name: Verify WS connections recovered
        # CLAUDE.md memory: prod recreates kill the WS; if there were live
        # connections before the roll and a restart actually happened, fail
        # unless at least one client reconnects within 60s. Skip when no
        # WS were connected pre-deploy or when the container wasn't
        # recreated (e.g. manual dispatch with no new image).
        run: |
          set -euo pipefail
          pre_ws='${{ steps.pre.outputs.ws }}'
          pre_uptime='${{ steps.pre.outputs.uptime }}'
          post_uptime='${{ steps.post.outputs.uptime }}'
          if [ "$pre_ws" = "0" ] || [ -z "$pre_ws" ]; then
            echo "No WS connections pre-deploy; skipping reconnect check"
            exit 0
          fi
          # Restart detected when uptime went backwards. Without a restart
          # the existing WS connections are still up — nothing to verify.
          if [ "$post_uptime" -ge "$pre_uptime" ]; then
            echo "No container recreate (pre_uptime=$pre_uptime, post_uptime=$post_uptime); skipping reconnect check"
            exit 0
          fi
          for i in $(seq 1 12); do
            after_ws=$(curl -sf --max-time 5 https://branchwork.dev/health | jq -r '.wsConnections // 0')
            if [ "$after_ws" -gt 0 ]; then
              echo "WS reconnected: $after_ws (was $pre_ws pre-deploy)"
              exit 0
            fi
            echo "[$i/12] waiting for WS reconnect (currently $after_ws)…"
            sleep 5
          done
          echo "::error::No WS clients reconnected within 60s (had $pre_ws before)"
          exit 1
