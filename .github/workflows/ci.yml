name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # On every master push, bump the patch version of server-rs/Cargo.toml
  # (and the matching Cargo.lock entry) and push the bump back as a fresh
  # commit. The downstream build / docker / deploy chain picks up that
  # bump commit, so every deploy lands on a distinct version number — a
  # human-visible "which build is in prod" signal.
  #
  # The job is self-idempotent: if the current commit is *itself* a bump
  # commit (recognised by its `chore: auto-bump to v…` subject), the
  # bump is skipped and the downstream jobs proceed normally. This is
  # what breaks the loop: human push A → bump pushes B → CI fires on B
  # with is_bump_commit=true → no further bump, full pipeline runs.
  #
  # Docker's workflow_run trigger (docker.yml) also filters on the bump
  # commit subject, so the build/publish only happens for the bump
  # commit, not the human commit underneath it.
  bump-version:
    name: Auto-bump patch on master push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      is_bump_commit: ${{ steps.classify.outputs.is_bump_commit }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GH_PAT is used so the resulting push *triggers* a follow-up
          # CI run on the bump commit. Pushes made with the default
          # GITHUB_TOKEN do not trigger downstream workflows.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 2

      - name: Classify current commit
        id: classify
        run: |
          msg=$(git log -1 --format=%s)
          if [[ "$msg" == "chore: auto-bump to v"* ]]; then
            echo "is_bump_commit=true" >> "$GITHUB_OUTPUT"
            echo "Already a bump commit ($msg) — skipping bump, downstream jobs run."
          else
            echo "is_bump_commit=false" >> "$GITHUB_OUTPUT"
            echo "Human commit ($msg) — will bump patch and push."
          fi

      - name: Bump Cargo.toml + Cargo.lock and push
        if: steps.classify.outputs.is_bump_commit == 'false'
        id: bump
        run: |
          set -euo pipefail
          cur=$(grep -m1 '^version' server-rs/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          IFS=. read -r maj min pat <<<"$cur"
          new="$maj.$min.$((pat + 1))"
          echo "Bumping $cur -> $new"
          # Cargo.toml: only one [package] version line.
          sed -i "s/^version = \"$cur\"$/version = \"$new\"/" server-rs/Cargo.toml
          # Cargo.lock: the version line *immediately following* the
          # `name = "branchwork-server"` line. The `n;s/.../.../` pair
          # reads the next line into the pattern space, then substitutes.
          sed -i '/^name = "branchwork-server"$/{n;s/^version = "'"$cur"'"$/version = "'"$new"'"/}' server-rs/Cargo.lock
          # Confirm both files actually moved — `set -e` won't catch a
          # silently-non-matching sed.
          grep -q "^version = \"$new\"$" server-rs/Cargo.toml
          grep -A1 '^name = "branchwork-server"$' server-rs/Cargo.lock | grep -q "version = \"$new\""
          git config user.name "branchwork-bot"
          git config user.email "bot@branchwork.dev"
          git add server-rs/Cargo.toml server-rs/Cargo.lock
          git commit -m "chore: auto-bump to v$new"
          git push origin HEAD:master
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

  server:
    needs: bump-version
    # Run on PRs (where bump-version is skipped) and on bump commits
    # (where bump-version ran with is_bump_commit=true). Skip on the
    # original human master push (bump-version=false): the bump commit
    # it produced will get its own full CI run a moment later.
    if: |
      always() && (
        github.event_name != 'push' ||
        needs.bump-version.outputs.is_bump_commit == 'true'
      )
    name: Rust — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep all OSes running even if one fails so we see the full matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rs/target
          key: ci-${{ matrix.os }}-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-

      # The build embeds web/dist via rust-embed, so it must exist.
      - name: Create web/dist placeholder (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p ../web/dist && touch ../web/dist/index.html

      - name: Create web/dist placeholder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../web/dist | Out-Null
          New-Item -ItemType File -Force -Path ../web/dist/index.html | Out-Null

      - name: cargo fmt --check
        # Rustfmt output is identical across OSes; only run it once to save time.
        if: runner.os != 'Windows'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # Runs unit tests AND integration tests under `tests/` — notably the
      # e2e suite (`tests/recovery.rs`, `tests/merge_guard.rs`) which spawns
      # the real `branchwork-server` binary against a scratch git repo and
      # drives it over HTTP. These would have caught every shipped bug in
      # the dashboard-polish cycle.
      - name: cargo test (unit + e2e)
        run: cargo test --release

      - name: Install cargo-audit
        # cargo-audit is a pure-Rust audit tool; we only need it once per run.
        if: runner.os != 'Windows'
        run: cargo install cargo-audit --locked

      - name: cargo audit
        if: runner.os != 'Windows'
        run: cargo audit

  web:
    needs: bump-version
    if: |
      always() && (
        github.event_name != 'push' ||
        needs.bump-version.outputs.is_bump_commit == 'true'
      )
    name: Web — typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint and format gates land before build so a fresh violation is
      # caught early and so the build step's signal stays "did the bundle
      # compile" rather than "is the codebase tidy".
      - name: Lint (ESLint)
        run: pnpm --filter @branchwork/web lint

      - name: Format (Prettier)
        run: pnpm --filter @branchwork/web format:check

      - name: Build
        run: pnpm --filter @branchwork/web build

      # Audit §20 bundle-size gate. Asserts the eagerly-loaded entry
      # chunk stays under the gzipped budget so a careless `import`
      # of a heavy dep can't silently regress first-paint cost.
      - name: Bundle-size budget
        run: pnpm --filter @branchwork/web bundle:check

  # End-to-end tests that need authenticated `gh` access (creates +
  # deletes scratch private repos) and an Anthropic API key. Kept in a
  # single ubuntu-latest job: the gh-backed paths are platform-neutral
  # and the matrix multiplier on the `server` job is enough OS coverage
  # for the rest of the suite.
  tests-e2e:
    needs: bump-version
    if: |
      always() && (
        github.event_name != 'push' ||
        needs.bump-version.outputs.is_bump_commit == 'true'
      )
    name: E2E tests (gh + Claude)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    env:
      # GH_TOKEN is the env name `gh` reads natively; piping the user's
      # personal-access secret through it avoids `gh auth login` flows.
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Opt the scratch-repo harness (`tests/support/gh.rs`) into real
      # GitHub round-trips. The default `cargo test` invocation on the
      # `server` job leaves this unset so it stays inert there.
      BRANCHWORK_TEST_GH_REPOS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rs/target
          key: ci-e2e-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: |
            ci-e2e-
            ci-ubuntu-latest-

      # rust-embed compiles web/dist into the binary, so it must exist
      # even though this job never serves the dashboard.
      - name: Create web/dist placeholder
        run: mkdir -p ../web/dist && touch ../web/dist/index.html

      # `gh` is preinstalled on ubuntu-latest. When GH_TOKEN is set, run
      # `gh auth status` so a bad/expired secret fails fast rather than
      # mid-test. When the secret is absent (fork PRs, repos that haven't
      # provisioned `GH_PAT` yet), warn and continue: the gh harness in
      # tests/support/gh.rs::maybe_create returns None on auth failure and
      # tests gracefully degrade through `with_github_repo() -> Option`.
      - name: Verify gh CLI + auth
        run: |
          gh --version
          if [ -n "$GH_TOKEN" ]; then
            gh auth status
          else
            echo "::warning::GH_PAT secret not set; gh-backed e2e paths will skip via tests/support/gh.rs::maybe_create"
          fi

      - name: cargo test --features e2e
        run: cargo test --release --features e2e
