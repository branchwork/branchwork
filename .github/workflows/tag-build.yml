name: Tag build

# Multi-arch Docker image build for git tag pushes (`v*`). Master
# pushes are handled by `pipeline.yml`'s `docker-build` /
# `docker-manifest` jobs — this file only exists because the tag
# trigger has different semantics (immutable semver tags +
# `:latest`) and shouldn't share concurrency with the master path.
#
# Manual workflow_dispatch is also supported so we can rebuild a
# tag image without re-tagging the git ref.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Docker build (${{ matrix.arch.docker }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { docker: amd64, runner: ubuntu-latest, suffix: amd64 }
          - { docker: arm64, runner: ubuntu-latest, suffix: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch.docker }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch.suffix }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch.suffix }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: build
    name: Manifest (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
            type=sha,prefix=,format=short
      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags=$(echo '${{ steps.meta.outputs.tags }}' | sed 's|^|--tag |' | tr '\n' ' ')
          refs=$(for f in *; do
            echo -n "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat $f) "
          done)
          docker buildx imagetools create $tags $refs
