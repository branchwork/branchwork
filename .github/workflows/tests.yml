name: Tests

# Reusable workflow that runs the test jobs (server, web) plus an
# opt-in e2e job. Callers decide whether to invoke it and whether to
# run the slow real-Claude/gh e2e suite (via the `run_e2e` input).
#
# Per-commit callers (pipeline.yml master pushes, task-tests.yml PRs)
# run server + web only — fast, hermetic, no network/API. The e2e suite
# (real `gh` repos + real Claude API: ~5 min, network-bound, occasionally
# flaky) runs on a schedule via e2e-nightly.yml and on workflow_dispatch,
# NOT on every commit.
#
# Speed: caching is via Swatinem/rust-cache (keyed robustly across the
# per-commit Cargo.lock version bump, which churned the old hashFiles()
# key every release) and cargo-audit ships as a prebuilt binary instead
# of being recompiled from source every run. Tests stay in RELEASE: the
# E2E-style integration tests spawn the real `CARGO_BIN_EXE_branchwork-
# server`, and a slower DEBUG server boot widens the startup race
# (curl `s==0` on the first request) into reliable flakes. The shipped
# binary is still compiled exactly once, separately, by build-binary.

on:
  workflow_call:
    inputs:
      run_e2e:
        description: "Run the real-Claude/gh e2e suite (slow; nightly/dispatch only)."
        type: boolean
        default: false
    secrets:
      GH_PAT: { required: false }
      ANTHROPIC_API_KEY: { required: false }

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── server (Rust) ────────────────────────────────────────────────
  server:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          # Separate cache namespace from build-binary's release/musl
          # cache so the two profiles/targets don't evict each other.
          shared-key: ci-test
      - name: Create web/dist placeholder
        run: mkdir -p ../web/dist && touch ../web/dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # Full parallelism: the server-spawn startup flake is bounded in the
      # harness itself now (tests/support/mod.rs caps live `branchwork-
      # server` instances to ~cores/2 via a process-wide semaphore), so the
      # cheap unit tests run unthrottled while server boots stay
      # uncontended. No blanket `--test-threads` cap needed.
      - run: cargo test --release
      # Prebuilt cargo-audit binary (the old `cargo install --locked`
      # recompiled it from source every run — minutes of pure waste).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── web ──────────────────────────────────────────────────────────
  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm --filter @branchwork/web lint
      - name: Format (Prettier)
        run: pnpm --filter @branchwork/web format:check
      - name: Build
        run: pnpm --filter @branchwork/web build
      - name: Bundle-size budget
        run: pnpm --filter @branchwork/web bundle:check

  # ── e2e (opt-in: real gh + Claude) ───────────────────────────────
  # Skipped unless the caller passes run_e2e=true (e2e-nightly.yml /
  # workflow_dispatch). Kept OFF the per-commit path so a flaky
  # network/API hiccup can't redden a merge and so the merge gate stays
  # fast.
  e2e:
    name: E2E tests (gh + Claude)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRANCHWORK_TEST_GH_REPOS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          shared-key: ci-e2e
      - run: mkdir -p ../web/dist && touch ../web/dist/index.html
      - name: Verify gh CLI + auth
        run: |
          gh --version
          if [ -n "$GH_TOKEN" ]; then
            gh auth status
          else
            echo "::warning::GH_PAT not set; gh-backed paths will skip via tests/support/gh.rs::maybe_create"
          fi
      - name: cargo test --features e2e
        run: cargo test --release --features e2e
