name: Tests

# Reusable workflow that runs the test jobs (server, web) plus an
# opt-in e2e job. Callers decide whether to invoke it and whether to
# run the slow real-Claude/gh e2e suite (via the `run_e2e` input).
#
# Per-commit callers (pipeline.yml master pushes, task-tests.yml PRs)
# run server + web only — fast, hermetic, no network/API. The e2e suite
# (real `gh` repos + real Claude API: ~5 min, network-bound, occasionally
# flaky) runs on a schedule via e2e-nightly.yml and on workflow_dispatch,
# NOT on every commit.
#
# Speed: Rust jobs build in DEBUG (release compile was ~2-4x slower and
# bought nothing for correctness tests — the shipped release binary is
# built once by pipeline.yml's build-binary job). Caching is via
# Swatinem/rust-cache (keyed robustly across the per-commit Cargo.lock
# version bump, which churned the old hashFiles() key every release).

on:
  workflow_call:
    inputs:
      run_e2e:
        description: "Run the real-Claude/gh e2e suite (slow; nightly/dispatch only)."
        type: boolean
        default: false
    secrets:
      GH_PAT: { required: false }
      ANTHROPIC_API_KEY: { required: false }

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── server (Rust) ────────────────────────────────────────────────
  server:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          # One shared cache across the fast Rust jobs; the build-binary
          # job (release/musl) keys separately so its artifacts don't
          # evict the debug cache.
          shared-key: ci-debug
      - name: Create web/dist placeholder
        run: mkdir -p ../web/dist && touch ../web/dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Prebuilt cargo-audit binary (the old `cargo install --locked`
      # recompiled it from source every run — minutes of pure waste).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── web ──────────────────────────────────────────────────────────
  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm --filter @branchwork/web lint
      - name: Format (Prettier)
        run: pnpm --filter @branchwork/web format:check
      - name: Build
        run: pnpm --filter @branchwork/web build
      - name: Bundle-size budget
        run: pnpm --filter @branchwork/web bundle:check

  # ── e2e (opt-in: real gh + Claude) ───────────────────────────────
  # Skipped unless the caller passes run_e2e=true (e2e-nightly.yml /
  # workflow_dispatch). Kept OFF the per-commit path so a flaky
  # network/API hiccup can't redden a merge and so the merge gate stays
  # fast.
  e2e:
    name: E2E tests (gh + Claude)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRANCHWORK_TEST_GH_REPOS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          shared-key: ci-e2e
      - run: mkdir -p ../web/dist && touch ../web/dist/index.html
      - name: Verify gh CLI + auth
        run: |
          gh --version
          if [ -n "$GH_TOKEN" ]; then
            gh auth status
          else
            echo "::warning::GH_PAT not set; gh-backed paths will skip via tests/support/gh.rs::maybe_create"
          fi
      - name: cargo test --features e2e
        run: cargo test --features e2e
