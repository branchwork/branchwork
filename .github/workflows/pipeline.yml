name: Pipeline

# Single workflow for the master build pipeline. ONE run per human push
# does everything, in order, gated so master never advances on red:
#
#   classify → tests → bump → build-binary → docker → deploy
#
# Test-before-bump (changed 2026-06-03): the fast test suite runs on the
# HUMAN commit and MUST pass before the version is bumped. Previously
# tests ran on the auto-bump commit AFTER it landed — so a human push
# showed a misleading green (tests skipped), feedback took two sequential
# runs, and master could carry an untested commit + a red bump on top.
#
# The version bump still produces the deploy artifact (the binary embeds
# CARGO_PKG_VERSION), so the order is test → bump → build the release
# binary from the bumped tree → image → deploy. The bump is pushed via
# PAT, which fires this workflow again on the bump commit; that run is a
# classify-only no-op (is_bump ⇒ every gate false) because the human-push
# run already tested, built, and deployed it.
#
# Build-once (changed 2026-06-03): the release binary is compiled exactly
# ONCE, in `build-binary` (amd64/musl, cached), and `docker` COPYs it via
# deploy/Dockerfile.runtime. Previously the Tests/Rust job compiled
# release AND the Docker job recompiled the whole project in-container
# (two arches, one discarded) — ~23 of ~24 wall-clock minutes.
#
# e2e (real gh + Claude) moved OFF this path to e2e-nightly.yml.
#
# PR-side tests are handled by `task-tests.yml`. Tag pushes (`v*`) are
# handled by `tag-build.yml`, which still uses the multi-arch
# deploy/Dockerfile for release images.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # the `bump` job pushes a commit back to master
  packages: write   # the `docker` job pushes images to GHCR

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── classify ─────────────────────────────────────────────────────
  classify:
    name: Classify event
    runs-on: ubuntu-latest
    outputs:
      is_bump_commit: ${{ steps.c.outputs.is_bump_commit }}
      should_bump:    ${{ steps.c.outputs.should_bump }}
      should_test:    ${{ steps.c.outputs.should_test }}
      should_build:   ${{ steps.c.outputs.should_build }}
      should_deploy:  ${{ steps.c.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%s)
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"

          is_master_push=false
          is_dispatch=false
          is_bump=false
          if [[ "$event" == "push" && "$ref" == "refs/heads/master" ]]; then
            is_master_push=true
          fi
          [[ "$event" == "workflow_dispatch" ]]      && is_dispatch=true
          [[ "$msg"   == "chore: auto-bump to v"* ]] && is_bump=true

          # A *human* master push (or a dispatch) drives the whole pipeline
          # in one run: test → bump → build → deploy. The bump commit that
          # the bump job pushes re-fires this workflow, but that run is a
          # classify-only no-op — the human-push run already did everything.
          human_push=false
          [[ "$is_master_push" == "true" && "$is_bump" != "true" ]] && human_push=true

          should_bump=false
          [[ "$human_push" == "true" ]] && should_bump=true

          # Test/build/deploy on the HUMAN commit now (NOT the bump commit)
          # and on explicit dispatch. PRs/task branches use task-tests.yml.
          should_test=false
          { [[ "$human_push" == "true" ]] || [[ "$is_dispatch" == "true" ]]; } && should_test=true

          should_build=$should_test
          should_deploy=$should_test

          {
            echo "is_bump_commit=$is_bump"
            echo "should_bump=$should_bump"
            echo "should_test=$should_test"
            echo "should_build=$should_build"
            echo "should_deploy=$should_deploy"
          } >> "$GITHUB_OUTPUT"

          cat <<SUMMARY
          event=$event ref=$ref msg='$msg'
            human_push=$human_push is_dispatch=$is_dispatch is_bump=$is_bump
            should_bump=$should_bump should_test=$should_test should_build=$should_build should_deploy=$should_deploy
          SUMMARY

  # ── tests (fast: server + web, NO e2e) ───────────────────────────
  # Runs on the human commit, BEFORE the bump. The gate the rest of the
  # pipeline hangs off — bump/build/deploy only proceed if this is green.
  tests:
    needs: classify
    if: needs.classify.outputs.should_test == 'true'
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # ── bump ─────────────────────────────────────────────────────────
  # Only after tests pass. Bumps the patch version, commits, pushes via
  # PAT (which re-fires this workflow on the bump commit as a no-op), and
  # outputs the pushed commit SHA so build/docker/deploy operate on the
  # bumped tree.
  bump:
    needs: [classify, tests]
    if: ${{ needs.classify.outputs.should_bump == 'true' && needs.tests.result == 'success' }}
    name: Auto-bump patch version
    runs-on: ubuntu-latest
    outputs:
      new_sha: ${{ steps.pushed.outputs.sha }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Bump Cargo.toml + Cargo.lock (commit only)
        id: bump
        run: |
          set -euo pipefail
          cur=$(grep -m1 '^version' server-rs/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          IFS=. read -r maj min pat <<<"$cur"
          new="$maj.$min.$((pat + 1))"
          echo "Bumping $cur -> $new"
          sed -i "s/^version = \"$cur\"$/version = \"$new\"/" server-rs/Cargo.toml
          sed -i '/^name = "branchwork-server"$/{n;s/^version = "'"$cur"'"$/version = "'"$new"'"/}' server-rs/Cargo.lock
          grep -q "^version = \"$new\"$" server-rs/Cargo.toml
          grep -A1 '^name = "branchwork-server"$' server-rs/Cargo.lock | grep -q "version = \"$new\""
          git config user.name "branchwork-bot"
          git config user.email "bot@branchwork.dev"
          git checkout -B master
          git add server-rs/Cargo.toml server-rs/Cargo.lock
          git commit -m "chore: auto-bump to v$new"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Acquire push lock (best-effort)
        id: lock
        env:
          BRANCHWORK_SAAS_URL: ${{ secrets.BRANCHWORK_SAAS_URL }}
          BUMP_PUSH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -z "${BRANCHWORK_SAAS_URL:-}" ]]; then
            echo "::notice::BRANCHWORK_SAAS_URL secret not set; skipping push-lock coordination."
            exit 0
          fi
          saas_url="${BRANCHWORK_SAAS_URL%/}"
          url="$saas_url/api/git/push-lock"
          short_sha=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          holder_meta="ci-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-sha-${short_sha}"
          body=$(jq -nc \
            --arg branch master \
            --arg holderKind ci \
            --arg holderMeta "$holder_meta" \
            --argjson waitSecs 30 \
            '{branch:$branch, holderKind:$holderKind, holderMeta:$holderMeta, waitSecs:$waitSecs}')
          auth_args=()
          [[ -n "${BUMP_PUSH_TOKEN:-}" ]] && auth_args=(-H "Authorization: Bearer ${BUMP_PUSH_TOKEN}")
          for attempt in 1 2 3; do
            set +e
            http_code=$(curl -sS -m 60 -X POST "${auth_args[@]}" \
              -H 'Content-Type: application/json' -d "$body" \
              -o /tmp/lock-response.json -w '%{http_code}' \
              "$url" 2>/tmp/lock-stderr)
            curl_exit=$?
            set -e
            case "$curl_exit:$http_code" in
              0:200)
                token=$(jq -r '.token // empty' /tmp/lock-response.json)
                if [[ -z "$token" ]]; then
                  echo "::warning::Acquire response missing .token; body: $(cat /tmp/lock-response.json)"
                  break
                fi
                echo "::add-mask::$token"
                {
                  echo "BUMP_LOCK_TOKEN=$token"
                  echo "BUMP_LOCK_BRANCH=master"
                  echo "BUMP_LOCK_HOLDER_META=$holder_meta"
                } >> "$GITHUB_ENV"
                echo "::notice::Acquired push lock on attempt $attempt"
                exit 0
                ;;
              0:503)
                echo "::warning::Push lock busy attempt $attempt; holder: $(jq -c '.holder // {}' /tmp/lock-response.json)"
                sleep $((5 * attempt))
                ;;
              *)
                echo "::warning::Push-lock endpoint unavailable (curl=$curl_exit http=$http_code attempt=$attempt)"
                break
                ;;
            esac
          done
          echo "::warning::Falling back to no-lock push; rebase+retry absorbs contention."

      - name: Push (rebase + retry on non-fast-forward)
        if: ${{ !cancelled() && steps.bump.outcome == 'success' }}
        run: |
          set -euo pipefail
          max_attempts=3
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            if git push origin master 2>/tmp/push-stderr; then
              [[ $attempt -gt 1 ]] && echo "::notice::Push succeeded on attempt $attempt after rebase."
              exit 0
            fi
            stderr=$(cat /tmp/push-stderr || true)
            if ! grep -qiE 'non-fast-forward|fetch first|rejected' <<<"$stderr"; then
              echo "::error::git push failed with non-non-FF error; not retrying."
              echo "$stderr" >&2
              exit 1
            fi
            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::Exhausted $max_attempts push attempts."
              echo "$stderr" >&2
              exit 1
            fi
            echo "::notice::Push rejected as non-fast-forward (attempt $attempt); rebasing."
            if ! git pull --rebase --autostash origin master 2>/tmp/rebase-stderr; then
              conflicting=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ' ' | sed 's/ $//')
              if [[ -n "$conflicting" ]]; then
                echo "::error::Rebase conflicts: $conflicting"
              else
                cat /tmp/rebase-stderr >&2
              fi
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          exit 1

      - name: Record pushed SHA
        id: pushed
        if: ${{ !cancelled() && steps.bump.outcome == 'success' }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release push lock
        if: ${{ always() && env.BUMP_LOCK_TOKEN != '' }}
        env:
          BRANCHWORK_SAAS_URL: ${{ secrets.BRANCHWORK_SAAS_URL }}
          BUMP_PUSH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          saas_url="${BRANCHWORK_SAAS_URL%/}"
          url="$saas_url/api/git/push-lock/release"
          body=$(jq -nc \
            --arg branch "${BUMP_LOCK_BRANCH:-master}" \
            --arg token "$BUMP_LOCK_TOKEN" \
            '{branch:$branch, token:$token}')
          auth_args=()
          [[ -n "${BUMP_PUSH_TOKEN:-}" ]] && auth_args=(-H "Authorization: Bearer ${BUMP_PUSH_TOKEN}")
          set +e
          http_code=$(curl -sS -m 30 -X POST "${auth_args[@]}" \
            -H 'Content-Type: application/json' -d "$body" \
            -o /tmp/release-response.json -w '%{http_code}' \
            "$url" 2>/tmp/release-stderr)
          curl_exit=$?
          set -e
          if [[ $curl_exit -ne 0 || "$http_code" != "200" ]]; then
            echo "::warning::Lock release failed (curl=$curl_exit http=$http_code); 30s TTL will evict."
            exit 0
          fi
          echo "::notice::Push lock released."

  # ── build-binary (the ONE release compile) ───────────────────────
  # Builds branchwork-server + branchwork-runner for x86_64-musl from the
  # bumped tree (so CARGO_PKG_VERSION matches) and uploads them. Docker
  # COPYs these — nothing compiles Rust in-container anymore.
  #
  # `target_sha` is the bump commit on a human push, or github.sha on
  # workflow_dispatch (no bump). The `if` uses !cancelled() so a SKIPPED
  # bump (dispatch path) doesn't skip this job.
  build-binary:
    needs: [classify, tests, bump]
    if: ${{ !cancelled() && needs.classify.outputs.should_build == 'true' && needs.tests.result == 'success' && (needs.bump.result == 'success' || needs.bump.result == 'skipped') }}
    name: Build release binary
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        run: echo "sha=${{ needs.bump.outputs.new_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.new_sha || github.sha }}
      # Frontend first — the server binary embeds web/dist at compile time.
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @branchwork/web build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          shared-key: ci-release-musl
      # zig + cargo-zigbuild: cross-link musl cleanly (matches the proven
      # deploy/Dockerfile toolchain). Pinned to the same zig 0.13.0.
      - name: Install zig
        run: |
          set -euo pipefail
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | sudo tar -xJ -C /usr/local
          sudo ln -sf /usr/local/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig
          zig version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release binaries (amd64/musl)
        working-directory: server-rs
        run: |
          set -euo pipefail
          cargo zigbuild --release --target x86_64-unknown-linux-musl \
            --bin branchwork-server --bin branchwork-runner
          mkdir -p ../dist-bin
          cp target/x86_64-unknown-linux-musl/release/branchwork-server ../dist-bin/
          cp target/x86_64-unknown-linux-musl/release/branchwork-runner ../dist-bin/
      - uses: actions/upload-artifact@v4
        with:
          name: branchwork-binaries
          path: dist-bin/
          retention-days: 3
          if-no-files-found: error

  # ── docker (copy prebuilt binary; no in-container compile) ────────
  docker:
    needs: [classify, build-binary]
    if: ${{ !cancelled() && needs.classify.outputs.should_build == 'true' && needs.build-binary.result == 'success' }}
    name: Docker
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.tags.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-binary.outputs.target_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: branchwork-binaries
          path: dist-bin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags from target SHA
        id: tags
        run: |
          set -euo pipefail
          full="${{ needs.build-binary.outputs.target_sha }}"
          short="${full:0:7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${short}"
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${full}"
            echo "${REGISTRY}/${IMAGE_NAME}:edge"
            echo "${REGISTRY}/${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  # ── deploy ───────────────────────────────────────────────────────
  deploy:
    needs: [classify, build-binary, docker]
    if: ${{ !cancelled() && needs.classify.outputs.should_deploy == 'true' && needs.docker.result == 'success' }}
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      HETZNER_USER: cpo
      HETZNER_HOST: 95.216.191.129
      PROD_DIR: /opt/branchwork/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-binary.outputs.target_sha }}
      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          full="${{ needs.build-binary.outputs.target_sha }}"
          short="${full:0:7}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/branchwork/branchwork:$short (commit $full)"
      - name: Install SSH credentials
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Capture pre-deploy state
        id: pre
        run: |
          set -euo pipefail
          before=$(curl -sf --max-time 10 https://branchwork.dev/health || echo '{}')
          echo "Pre-deploy /health: $before"
          ws=$(echo "$before" | jq -r '.wsConnections // 0')
          uptime=$(echo "$before" | jq -r '.uptimeSeconds // 0')
          echo "ws=$ws" >> "$GITHUB_OUTPUT"
          echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
      - name: Sync compose files
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              deploy/docker-compose.yml deploy/docker-compose.prod.yml \
              ${HETZNER_USER}@${HETZNER_HOST}:${PROD_DIR}/deploy/
      - name: Pin version + roll container
        env:
          SHA: ${{ steps.target.outputs.short }}
          FULL_SHA: ${{ steps.target.outputs.full }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              ${HETZNER_USER}@${HETZNER_HOST} \
              "SHA=${SHA} FULL_SHA=${FULL_SHA} PROD_DIR=${PROD_DIR} bash -se" <<'REMOTE'
          set -euo pipefail
          cd "${PROD_DIR}/deploy"
          [ -f .env ] && cp .env ".env.bak.$(date +%s)"
          {
            echo "# Written by pipeline.yml — do not edit by hand"
            echo "# Commit: ${FULL_SHA}"
            echo "# At:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BRANCHWORK_VERSION=${SHA}"
          } > .env
          cd "${PROD_DIR}"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml pull
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
          REMOTE
      - name: Verify post-deploy health
        id: post
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            resp=$(curl -sf --max-time 5 https://branchwork.dev/health || echo '')
            if [ -n "$resp" ]; then
              uptime=$(echo "$resp" | jq -r '.uptimeSeconds // -1')
              echo "Post-deploy /health: $resp"
              echo "uptime=$uptime" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$i/60] /health not 200 yet…"
            sleep 5
          done
          echo "::error::/health did not return 200 within 5 minutes"
          exit 1
      - name: Verify running image matches target SHA
        env:
          SHA: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          running=$(ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              ${HETZNER_USER}@${HETZNER_HOST} \
              "cd ${PROD_DIR} && docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml ps --format '{{.Image}}' branchwork")
          echo "Running image: $running"
          if [[ "$running" != *":${SHA}" ]]; then
            echo "::error::Running image '$running' does not end in ':${SHA}'"
            exit 1
          fi
      - name: Verify WS connections recovered
        run: |
          set -euo pipefail
          pre_ws='${{ steps.pre.outputs.ws }}'
          pre_uptime='${{ steps.pre.outputs.uptime }}'
          post_uptime='${{ steps.post.outputs.uptime }}'
          if [ "$pre_ws" = "0" ] || [ -z "$pre_ws" ]; then
            echo "No WS connections pre-deploy; skipping reconnect check"
            exit 0
          fi
          if [ "$post_uptime" -ge "$pre_uptime" ]; then
            echo "No container recreate; skipping reconnect check"
            exit 0
          fi
          for i in $(seq 1 12); do
            after_ws=$(curl -sf --max-time 5 https://branchwork.dev/health | jq -r '.wsConnections // 0')
            if [ "$after_ws" -gt 0 ]; then
              echo "WS reconnected: $after_ws (was $pre_ws pre-deploy)"
              exit 0
            fi
            echo "[$i/12] waiting for WS reconnect (currently $after_ws)…"
            sleep 5
          done
          echo "::error::No WS clients reconnected within 60s (had $pre_ws before)"
          exit 1
