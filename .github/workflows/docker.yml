name: Docker

on:
  # Trunk publishes are gated on a green CI run so a broken push to master
  # never produces a deployable :edge image. Tag pushes and manual dispatches
  # bypass the gate — releases are explicit human action.
  workflow_run:
    workflows: [CI] # name from ci.yml
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Two gates for the workflow_run case:
    #   1. The triggering CI run must have been green.
    #   2. The commit at the tip must be an auto-bump commit (subject
    #      starts with `chore: auto-bump to v`).
    # The second gate is belt-and-suspenders since auto-push-rebase-on-
    # non-fast-forward task 2.3 split bump.yml out of ci.yml: ci.yml
    # now only fires (does real work) on the bump commit itself, so the
    # CI runs Docker would see are already filtered to bump commits.
    # The gate stays in place to handle workflow_dispatch and any
    # edge case where ci.yml runs on a non-bump commit (e.g. a future
    # workflow_run from a different upstream).
    #
    # Tag pushes (`push: tags: v*`) and manual dispatches bypass both
    # gates — releases are explicit and don't go through the bump path.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore: auto-bump to v'))
    strategy:
      # Keep both arches running even if one fails so the failure mode is
      # visible (e.g. arm64 zigbuild regression) rather than masked by
      # an early-exit on the other arch.
      fail-fast: false
      matrix:
        arch:
          - { docker: amd64, runner: ubuntu-latest, suffix: amd64 }
          - { docker: arm64, runner: ubuntu-latest, suffix: arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch.docker }}
          push: true
          # push-by-digest=true,name-canonical=true uploads a per-arch image
          # indexed by digest only, with no human-readable tag. The manifest
          # job below attaches the human-readable tags pointing at both
          # digests.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo -n "$digest" > /tmp/digests/${{ matrix.arch.suffix }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch.suffix }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags=$(echo '${{ steps.meta.outputs.tags }}' \
            | sed 's|^|--tag |' | tr '\n' ' ')
          refs=$(for f in *; do
            echo -n "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat $f) "
          done)
          docker buildx imagetools create $tags $refs
