name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gate as ci.yml's `tests-e2e` job — duplicated here because tag
  # pushes (release trigger) don't reuse master-push CI runs, and
  # release artifacts must not ship from a tag whose tip never passed
  # the e2e suite. Kept inline rather than factored into a reusable
  # workflow to keep the release pipeline readable in a single file.
  tests-e2e:
    name: E2E tests (gh + Claude)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRANCHWORK_TEST_GH_REPOS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rs/target
          key: release-e2e-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: |
            release-e2e-
            ci-e2e-

      - name: Create web/dist placeholder
        run: mkdir -p ../web/dist && touch ../web/dist/index.html

      - name: Verify gh CLI + auth
        run: |
          gh --version
          gh auth status

      - name: cargo test --features e2e
        run: cargo test --release --features e2e

  build:
    needs: tests-e2e
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            artifact: branchwork-server-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            artifact: branchwork-server-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
            artifact: branchwork-server-macos-x64
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            artifact: branchwork-server-macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @branchwork/web build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rs/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        working-directory: server-rs
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        working-directory: server-rs
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp server-rs/target/${{ matrix.target }}/release/branchwork-server dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/**/*.tar.gz
