name: Bump

# On every human master push, bump the patch version of server-rs/Cargo.toml
# (and the matching Cargo.lock entry) and push the bump back as a fresh
# commit. The downstream build / docker / deploy chain picks up that bump
# commit, so every deploy lands on a distinct version number — a
# human-visible "which build is in prod" signal.
#
# The workflow is self-idempotent via a job-level `if` gate on the commit
# message: when the head commit is itself a bump commit (its subject starts
# with `chore: auto-bump to v…`), the job is skipped. This is what breaks
# the loop: human push A → bump.yml fires + bumps → pushes B → bump.yml
# fires on B but its only job is skipped, so no further bump.
#
# Lifted out of ci.yml (auto-push-rebase-on-non-fast-forward plan task 2.3)
# so the human-push CI run stops producing a workflow run with five skipped
# jobs in it. The new ci.yml only fires on the bump commit; this workflow
# only fires on non-bump commits; together they cover the same surface with
# no overlap.

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bump-version:
    name: Auto-bump patch on master push
    # Skip on already-bumped commits so the bump → push → bump loop
    # terminates. The bump commit B that this job produces will trigger
    # bump.yml again, but this gate makes that second invocation a no-op
    # (single skipped job in the Actions tab, no work performed).
    if: |
      !startsWith(github.event.head_commit.message, 'chore: auto-bump to v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GH_PAT is used so the resulting push *triggers* a follow-up
          # CI run on the bump commit. Pushes made with the default
          # GITHUB_TOKEN do not trigger downstream workflows.
          token: ${{ secrets.GH_PAT }}
          # fetch-depth bumped from 2 → 0 so the rebase+retry fallback
          # in the push step has enough history to rebase against an
          # `origin/master` that has drifted multiple commits ahead.
          # The bump-version path is a single workflow per push so the
          # one-shot full-clone cost is fine.
          fetch-depth: 0

      - name: Bump Cargo.toml + Cargo.lock (commit only)
        id: bump
        run: |
          set -euo pipefail
          cur=$(grep -m1 '^version' server-rs/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          IFS=. read -r maj min pat <<<"$cur"
          new="$maj.$min.$((pat + 1))"
          echo "Bumping $cur -> $new"
          # Cargo.toml: only one [package] version line.
          sed -i "s/^version = \"$cur\"$/version = \"$new\"/" server-rs/Cargo.toml
          # Cargo.lock: the version line *immediately following* the
          # `name = "branchwork-server"` line. The `n;s/.../.../` pair
          # reads the next line into the pattern space, then substitutes.
          sed -i '/^name = "branchwork-server"$/{n;s/^version = "'"$cur"'"$/version = "'"$new"'"/}' server-rs/Cargo.lock
          # Confirm both files actually moved — `set -e` won't catch a
          # silently-non-matching sed.
          grep -q "^version = \"$new\"$" server-rs/Cargo.toml
          grep -A1 '^name = "branchwork-server"$' server-rs/Cargo.lock | grep -q "version = \"$new\""
          git config user.name "branchwork-bot"
          git config user.email "bot@branchwork.dev"
          # actions/checkout@v4 leaves us in detached HEAD; pin to a
          # real local `master` so `git pull --rebase origin master`
          # in the push step below operates on a branch, not a detached
          # HEAD (which it can, but the resulting state is harder to
          # reason about when debugging a stuck CI run).
          git checkout -B master
          git add server-rs/Cargo.toml server-rs/Cargo.lock
          git commit -m "chore: auto-bump to v$new"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      # Best-effort acquire of the per-branch advisory push lock that
      # `branchwork-server`'s auto-mode loop also holds during merge →
      # push (server-rs/src/api/git.rs + auto_mode::wait_for_push_lock).
      # If the lock acquires, the in-process auto-mode flow will block
      # on `wait_for_push_lock` until we release, so the two never race
      # to push to origin/master.
      #
      # Degradation modes (all fall through to the rebase+retry push):
      #   - `BRANCHWORK_SAAS_URL` secret absent → skip coordination.
      #   - Endpoint unreachable / non-2xx → skip coordination.
      #   - Endpoint returns 503 three times running → skip coordination.
      # In every miss case, the push step below still absorbs non-FF
      # rejections via `git pull --rebase --autostash` (the shell mirror
      # of `git_helpers::push_branch_local` from Phase 1).
      #
      # NOTE: the endpoint is `OptionalAuthUser` today, so the
      # `BUMP_PUSH_TOKEN` secret is forwarded as a Bearer header for
      # operators who put a reverse proxy in front of the SaaS URL.
      # When unset, the request is sent unauthenticated.
      - name: Acquire push lock (best-effort)
        id: lock
        env:
          BRANCHWORK_SAAS_URL: ${{ secrets.BRANCHWORK_SAAS_URL }}
          BUMP_PUSH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -z "${BRANCHWORK_SAAS_URL:-}" ]]; then
            echo "::notice::BRANCHWORK_SAAS_URL secret not set; skipping push-lock coordination."
            exit 0
          fi
          saas_url="${BRANCHWORK_SAAS_URL%/}"
          url="$saas_url/api/git/push-lock"
          # Separate the substitution so a missing git or a corrupt
          # checkout doesn't fail the whole step under `set -e` — the
          # lock acquire must remain best-effort.
          short_sha=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          holder_meta="ci-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-sha-${short_sha}"
          body=$(jq -nc \
            --arg branch master \
            --arg holderKind ci \
            --arg holderMeta "$holder_meta" \
            --argjson waitSecs 30 \
            '{branch:$branch, holderKind:$holderKind, holderMeta:$holderMeta, waitSecs:$waitSecs}')
          auth_args=()
          if [[ -n "${BUMP_PUSH_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer ${BUMP_PUSH_TOKEN}")
          fi
          # Outer retry loop: the server already waits up to `waitSecs`
          # internally for the holder to release, so a 503 here means
          # the holder kept the lock the whole 30 seconds. Retry a few
          # times with exponential-ish backoff (5s, 10s, 15s) before
          # giving up and falling through to the unlocked push.
          for attempt in 1 2 3; do
            set +e
            http_code=$(curl -sS -m 60 -X POST \
              "${auth_args[@]}" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              -o /tmp/lock-response.json \
              -w '%{http_code}' \
              "$url" 2>/tmp/lock-stderr)
            curl_exit=$?
            set -e
            case "$curl_exit:$http_code" in
              0:200)
                token=$(jq -r '.token // empty' /tmp/lock-response.json)
                if [[ -z "$token" ]]; then
                  echo "::warning::Acquire response missing .token field; body: $(cat /tmp/lock-response.json)"
                  break
                fi
                # Mask the token in subsequent log output, then expose
                # it to later steps via $GITHUB_ENV so the always-run
                # release step can use it.
                echo "::add-mask::$token"
                {
                  echo "BUMP_LOCK_TOKEN=$token"
                  echo "BUMP_LOCK_BRANCH=master"
                  echo "BUMP_LOCK_HOLDER_META=$holder_meta"
                } >> "$GITHUB_ENV"
                echo "::notice::Acquired push lock on attempt $attempt (holderMeta=$holder_meta)."
                exit 0
                ;;
              0:503)
                holder=$(jq -c '.holder // {}' /tmp/lock-response.json 2>/dev/null || echo "{}")
                echo "::warning::Push lock busy on attempt $attempt; live holder: $holder"
                sleep $((5 * attempt))
                ;;
              0:*)
                echo "::warning::Push-lock endpoint returned http=$http_code on attempt $attempt: $(cat /tmp/lock-response.json 2>/dev/null || true)"
                break
                ;;
              *)
                echo "::warning::curl to push-lock endpoint failed (exit=$curl_exit, http=$http_code, attempt=$attempt): $(cat /tmp/lock-stderr 2>/dev/null || true)"
                break
                ;;
            esac
          done
          echo "::warning::Falling back to no-lock push; rebase+retry will absorb any non-FF contention."

      # The actual push, with a 3-attempt rebase+retry loop that mirrors
      # `server-rs/src/git_helpers.rs::push_branch_local` (Phase 1 of
      # the auto-push-rebase-on-non-fast-forward plan). Even when the
      # lock was acquired above, we keep the rebase fallback as defense
      # in depth — the lock is a coordination hint, not a hard barrier.
      #
      # `!cancelled() && steps.bump.outcome == 'success'`: run regardless
      # of whether the Acquire step succeeded or fell through to its
      # graceful-degradation path (or even crashed for an unexpected
      # reason). The acquire is best-effort; the push must always run
      # when the bump itself succeeded.
      - name: Push (rebase + retry on non-fast-forward)
        if: |
          !cancelled() &&
          steps.bump.outcome == 'success'
        run: |
          set -euo pipefail
          max_attempts=3
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            if git push origin master 2>/tmp/push-stderr; then
              if [[ $attempt -gt 1 ]]; then
                echo "::notice::Push succeeded on attempt $attempt after rebase."
              fi
              exit 0
            fi
            stderr=$(cat /tmp/push-stderr || true)
            # Same three markers `is_non_fast_forward_error` matches:
            # `rejected` | `non-fast-forward` | `fetch first`.
            if ! grep -qiE 'non-fast-forward|fetch first|rejected' <<<"$stderr"; then
              echo "::error::git push failed with non-non-FF error; not retrying."
              echo "$stderr" >&2
              exit 1
            fi
            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::Exhausted $max_attempts push attempts; bubbling last error."
              echo "$stderr" >&2
              exit 1
            fi
            echo "::notice::Push rejected as non-fast-forward (attempt $attempt); rebasing against origin/master."
            if ! git pull --rebase --autostash origin master 2>/tmp/rebase-stderr; then
              conflicting=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ' ' | sed 's/ $//')
              if [[ -n "$conflicting" ]]; then
                echo "::error::Rebase against origin/master produced conflicts in: $conflicting"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              echo "::error::Rebase against origin/master failed (non-conflict)."
              cat /tmp/rebase-stderr >&2
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          # Unreachable: the loop either `exit 0`s on success or `exit 1`s
          # on terminal error. Belt-and-braces safety.
          exit 1

      # Always-run cleanup so an early-failing push step still releases
      # the lock. The 30s server-side TTL force-evicts orphaned locks
      # eventually, but explicit release unblocks in-process auto-mode
      # immediately. Best-effort: a release failure is logged as a
      # warning and does not fail the job.
      - name: Release push lock
        if: always() && env.BUMP_LOCK_TOKEN != ''
        env:
          BRANCHWORK_SAAS_URL: ${{ secrets.BRANCHWORK_SAAS_URL }}
          BUMP_PUSH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          saas_url="${BRANCHWORK_SAAS_URL%/}"
          url="$saas_url/api/git/push-lock/release"
          body=$(jq -nc \
            --arg branch "${BUMP_LOCK_BRANCH:-master}" \
            --arg token "$BUMP_LOCK_TOKEN" \
            '{branch:$branch, token:$token}')
          auth_args=()
          if [[ -n "${BUMP_PUSH_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer ${BUMP_PUSH_TOKEN}")
          fi
          set +e
          http_code=$(curl -sS -m 30 -X POST \
            "${auth_args[@]}" \
            -H 'Content-Type: application/json' \
            -d "$body" \
            -o /tmp/release-response.json \
            -w '%{http_code}' \
            "$url" 2>/tmp/release-stderr)
          curl_exit=$?
          set -e
          if [[ $curl_exit -ne 0 || "$http_code" != "200" ]]; then
            echo "::warning::Push-lock release failed (exit=$curl_exit, http=$http_code): $(cat /tmp/release-stderr 2>/dev/null || true). Lock will auto-evict after the 30s server-side TTL."
            exit 0
          fi
          released=$(jq -r '.released // false' /tmp/release-response.json 2>/dev/null || echo "false")
          if [[ "$released" == "true" ]]; then
            echo "::notice::Push lock released (holderMeta=${BUMP_LOCK_HOLDER_META:-unknown})."
          else
            echo "::warning::Push-lock release returned released=false (lock may have already evicted via TTL)."
          fi
