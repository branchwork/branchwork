[package]
name = "branchwork-server"
version = "0.5.136"
edition = "2024"
license = "MIT"

[features]
# Enables tests that require external services (GitHub via `gh`, Anthropic
# API). The e2e job in CI sets `BRANCHWORK_TEST_GH_REPOS=1` + provides
# `ANTHROPIC_API_KEY` / `GH_TOKEN` and runs `cargo test --release
# --features e2e`. The flag is empty today; tests exercise gh paths via
# the existing env-var gate, but `#[cfg(feature = "e2e")]` is reserved
# for tests that should NEVER compile in the default flow.
e2e = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
regex = "1"
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.6"
rusqlite = { version = "0.35", features = ["bundled"] }
serde_yaml = "0.9"
toml = "0.8"
portable-pty = "0.9"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
interprocess = { version = "2", features = ["tokio"] }
postcard = { version = "1", features = ["alloc"] }
rmcp = { version = "1.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
schemars = "1"
bcrypt = "0.19"
rand = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1-rustls-tls", "smtp-transport"] }
jsonwebtoken = "9"
base64 = "0.22"
quick-xml = "0.37"
flate2 = "1"
sha2 = "0.10"
aes-gcm = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "alloc", "rand_core"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "branchwork-runner"
path = "src/bin/branchwork_runner.rs"

# Test-only `claude` replacement for the diamond-dispatch harness. Put on
# PATH ahead of the real binary in integration tests so the supervisor's
# PTY spawns deterministic per-task actions from a YAML file. Gated by
# the `e2e` feature so production / CI image builds skip it.
[[bin]]
name = "scripted_agent"
path = "tests/support/scripted_agent/main.rs"
required-features = ["e2e"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
