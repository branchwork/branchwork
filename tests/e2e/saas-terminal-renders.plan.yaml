title: Terminal renders e2e
context: |
  Pre-canned plan for the SaaS terminal-renders Playwright spec. The
  bash runner at tests/e2e/run-playwright-saas.sh `docker cp`s this
  file into the server container's `/data/plans/` so the dashboard
  picks it up via the file watcher — bypassing the planner agent
  entirely. The task agent is the TUI stub at
  tests/e2e/stub-claude-tui.sh, mounted as `/usr/local/bin/claude` in
  the runner via the docker-compose.e2e-stub.yml overlay.

project: saas-terminal-renders
phases:
  - number: 0
    title: Phase 0
    description: Stubbed phase
    tasks:
      - number: "0.1"
        title: Render sentinel
        description: |
          Stub claude prints `BRANCHWORK-TUI-READY` and sleeps. The
          spec asserts the dashboard's xterm shows the sentinel
          within 5 s of clicking Start, and still shows it after a
          sidebar toggle / resize (Task 4.1 + 4.2 regression pin).
        produces_commit: false
